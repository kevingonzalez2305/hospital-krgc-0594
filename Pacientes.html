<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>
    <style>
        /* Estilos generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.45)), 
                        url("imagen2.jpg") no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
        }

        /* Barra de navegación */
        header.site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            background: rgba(15, 20, 30, 0.3);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffffff;
        }

        nav a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            margin-left: 22px;
            font-size: 0.95rem;
            transition: color 0.3s, border-bottom 0.3s;
            padding-bottom: 5px;
        }

        nav a:hover {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        /* Contenido principal */
        main {
            width: 90%;
            max-width: 1300px;
            margin: 140px auto 40px auto;
            padding: 20px;
        }

        main h1 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 3rem;
            font-weight: 600;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.6);
        }

        .contenedor {
            display: grid;
            grid-template-columns: 1fr 2.5fr;
            gap: 30px;
        }

        /* Sidebar */
        .sidebar {
            background: rgba(15, 22, 36, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .sidebar h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .sidebar input, .sidebar textarea, .sidebar button {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.07);
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }
        .sidebar textarea {
            resize: vertical;
            min-height: 80px;
        }

        .sidebar input::placeholder, .sidebar textarea::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .sidebar button {
            background: #ffffff;
            color: #111622;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 0;
        }

        /* Lista de pacientes */
        .contenido {
            background: rgba(15, 22, 36, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Footer */
        footer {
            background: rgba(10, 15, 26, 0.5);
            backdrop-filter: blur(12px);
            color: #e5e7eb;
            text-align: center;
            padding: 50px 20px;
            margin-top: 80px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Responsive */
        @media(max-width: 960px) {
            .contenedor {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="logo">👤 Pacientes</div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="Doctores.html">Doctores</a>
            <a href="Medicamentos.html">Medicamentos</a>
        </nav>
    </header>

    <main>
        <h1>Registro de Pacientes</h1>
        <div class="contenedor">
            <div class="sidebar">
                <h3>Agregar Paciente</h3>
                <form id="addPacienteForm">
                    <input type="text" name="nombre" placeholder="Nombre" required>
                    <input type="number" name="edad" placeholder="Edad" required>
                    <input type="text" name="sexo" placeholder="Sexo" required>
                    <input type="text" name="ocupacion" placeholder="Ocupación" required>
                    <textarea name="diagnostico" placeholder="Diagnóstico" required></textarea>
                    <textarea name="tratamiento" placeholder="Tratamiento" required></textarea>
                    <button type="submit">Guardar</button>
                </form>
            </div>
            <div class="contenido">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Sexo</th>
                            <th>Ocupación</th>
                            <th>Diagnóstico</th>
                            <th>Tratamiento</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPacientes">
                        <!-- Los pacientes se cargarán aquí desde el servidor -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <h3>Datos del Alumno</h3>
        <p><strong>Nombre:</strong> Kevin Raul Gonzalez Chavez</p>
        <p><strong>No. Control:</strong> 23308051280594</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('addPacienteForm');
            const tablaPacientes = document.getElementById('tablaPacientes');

            const fetchPacientes = async () => {
                try {
                    const response = await fetch('/api/pacientes');
                    const pacientes = await response.json();
                    
                    tablaPacientes.innerHTML = '';
                    
                    pacientes.forEach(paciente => {
                        const fila = document.createElement('tr');
                        fila.innerHTML = `
                            <td>${paciente.nombre}</td>
                            <td>${paciente.edad}</td>
                            <td>${paciente.sexo}</td>
                            <td>${paciente.ocupacion}</td>
                            <td>${paciente.diagnostico}</td>
                            <td>${paciente.tratamiento}</td>
                        `;
                        tablaPacientes.appendChild(fila);
                    });
                } catch (error) {
                    console.error("Error al cargar pacientes: ", error);
                    alert("No se pudieron cargar los pacientes.");
                }
            };

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                
                try {
                    const response = await fetch('/api/pacientes', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    if (response.ok) {
                        form.reset();
                        fetchPacientes();
                    } else {
                        alert("Error al guardar el paciente.");
                    }
                } catch (error) {
                    console.error("Error al guardar paciente: ", error);
                    alert("No se pudo conectar con el servidor para guardar el paciente.");
                }
            });

            fetchPacientes();
        });
    </script>

</body>
</html>
