<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pacientes</title>

<style>

/* ---------------- GENERAL ---------------- */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
}

/* HEADER */
header{
    background:#3498db;
    color:white;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    border-bottom:5px solid #222;
}

/* NAV */
nav{
    background:#222;
    padding:15px;
}

nav ul{
    display:flex;
    justify-content:center;
    gap:20px;
    list-style:none;
}

nav a{
    text-decoration:none;
    color:white;
    background:#3498db;
    padding:10px 18px;
    border-radius:8px;
}

/* MAIN */
main{
    width:90%;
    margin:30px auto;
    background:white;
    border:5px solid black;
    padding:20px;
}

main h1{
    text-align:center;
    margin-bottom:25px;
}

/* GRID */
.contenedor{
    display:grid;
    grid-template-columns:1fr 3fr;
    gap:20px;
}

/* FORM */
.formulario{
    background:#3498db;
    border:4px solid black;
    border-radius:15px;
    padding:20px;
    color:white;
}

.formulario input,
.formulario textarea{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:none;
    border-radius:8px;
}

.formulario button{
    width:100%;
    padding:12px;
    background:#222;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

/* BUSCADOR */
.caja{
    background:#3498db;
    border:4px solid black;
    border-radius:15px;
    padding:20px;
}

.caja input{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
}

/* LISTA */
.contenido{
    background:#fafafa;
    border:3px solid black;
    border-radius:15px;
    padding:20px;
}

/* CARD */
.card{
    background:white;
    border-left:10px solid #3498db;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* BOTONES */
.btn-eliminar{
    margin-top:10px;
    background:red;
    color:white;
    border:none;
    padding:8px;
    border-radius:6px;
    cursor:pointer;
}

.btn-editar{
    margin-top:10px;
    margin-left:10px;
    background:orange;
    color:white;
    border:none;
    padding:8px;
    border-radius:6px;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
    border-top:5px solid #3498db;
}

</style>

</head>

<body>

<header>👨‍⚕️ Pacientes</header>

<nav>
    <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="Doctores.html">Doctores</a></li>
        <li><a href="Medicamentos.html">Medicamentos</a></li>
    </ul>
</nav>

<main>

<h1>Lista de Pacientes</h1>

<div class="contenedor">

    <!-- FORM -->
    <div>

        <div class="formulario">

            <h2>➕ Agregar Paciente</h2>

            <input type="text" id="nombre" placeholder="Nombre">
            <input type="text" id="edad" placeholder="Edad">
            <input type="text" id="sexo" placeholder="Sexo">
            <input type="text" id="ocupacion" placeholder="Ocupación">
            <textarea id="diagnostico" placeholder="Diagnóstico"></textarea>
            <textarea id="tratamiento" placeholder="Tratamiento"></textarea>

            <button onclick="agregarPaciente()">Guardar Paciente</button>

        </div>

        <div class="caja">
            <input type="text" id="buscar" placeholder="🔍 Buscar paciente...">
        </div>

    </div>

    <!-- LISTA -->
    <div class="contenido" id="listaPacientes"></div>

</div>

</main>

<footer>
    <h3>Datos del Alumno</h3>
    <p>Kevin Raul Gonzalez Chavez</p>
    <p>No. Control: 23308051280594</p>
    <p>Grupo: 4-I</p>
</footer>

<script>

/* ---------------- INICIALIZAR 10 PACIENTES ---------------- */
window.onload = function(){

    let lista = JSON.parse(localStorage.getItem("pacientes"));

    if(!lista || lista.length === 0){

        lista = [
            {nombre:"Carlos Ramírez Torres", edad:"60", sexo:"Masculino", ocupacion:"Jubilado", diagnostico:"Diabetes", tratamiento:"Metformina"},
            {nombre:"Ana Martínez Díaz", edad:"27", sexo:"Femenino", ocupacion:"Enfermera", diagnostico:"Infección urinaria", tratamiento:"Nitrofurantoína"},
            {nombre:"Luis Fernández Soto", edad:"50", sexo:"Masculino", ocupacion:"Comerciante", diagnostico:"Angina", tratamiento:"Control cardiaco"},
            {nombre:"Laura Méndez Castro", edad:"38", sexo:"Femenino", ocupacion:"Abogada", diagnostico:"Hipotiroidismo", tratamiento:"Levotiroxina"},
            {nombre:"Pedro Sánchez Molina", edad:"29", sexo:"Masculino", ocupacion:"Ingeniero", diagnostico:"Faringitis", tratamiento:"Paracetamol"},
            {nombre:"Sofía Herrera León", edad:"41", sexo:"Femenino", ocupacion:"Secretaria", diagnostico:"Migraña", tratamiento:"Sumatriptán"},
            {nombre:"Diego Morales Cruz", edad:"55", sexo:"Masculino", ocupacion:"Chofer", diagnostico:"Gonartrosis", tratamiento:"Fisioterapia"},
            {nombre:"Valentina Rojas Núñez", edad:"24", sexo:"Femenino", ocupacion:"Estudiante", diagnostico:"Anemia", tratamiento:"Hierro"},
            {nombre:"Fernando López García", edad:"46", sexo:"Masculino", ocupacion:"Maestro", diagnostico:"Hipertensión", tratamiento:"Losartán"},
            {nombre:"Mariana Torres Vega", edad:"33", sexo:"Femenino", ocupacion:"Diseñadora", diagnostico:"Gastritis", tratamiento:"Omeprazol"}
        ];

        localStorage.setItem("pacientes", JSON.stringify(lista));
    }

    cargarPacientes();
};

/* ---------------- BUSCADOR ---------------- */
document.getElementById("buscar").addEventListener("keyup", function(){

    let texto = this.value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        card.style.display = card.textContent.toLowerCase().includes(texto)
        ? "block"
        : "none";
    });

});

/* ---------------- AGREGAR ---------------- */
function agregarPaciente(){

    let nombre = document.getElementById("nombre").value;
    let edad = document.getElementById("edad").value;
    let sexo = document.getElementById("sexo").value;
    let ocupacion = document.getElementById("ocupacion").value;
    let diagnostico = document.getElementById("diagnostico").value;
    let tratamiento = document.getElementById("tratamiento").value;

    if(!nombre || !edad || !sexo || !ocupacion || !diagnostico || !tratamiento){
        alert("⚠️ Llena todos los campos");
        return;
    }

    let paciente = {nombre, edad, sexo, ocupacion, diagnostico, tratamiento};

    let lista = JSON.parse(localStorage.getItem("pacientes")) || [];
    lista.push(paciente);

    localStorage.setItem("pacientes", JSON.stringify(lista));

    crearCard(paciente);
    limpiar();
}

/* ---------------- CREAR CARD ---------------- */
function crearCard(p){

    let div = document.createElement("div");
    div.classList.add("card");

    div.innerHTML = `
        <h2>${p.nombre}</h2>
        <p><strong>Edad:</strong> ${p.edad}</p>
        <p><strong>Sexo:</strong> ${p.sexo}</p>
        <p><strong>Ocupación:</strong> ${p.ocupacion}</p>
        <p><strong>Diagnóstico:</strong> ${p.diagnostico}</p>
        <p><strong>Tratamiento:</strong> ${p.tratamiento}</p>

        <button class="btn-eliminar" onclick="eliminar(this)">Eliminar</button>
        <button class="btn-editar" onclick="editar(this)">Editar</button>
    `;

    document.getElementById("listaPacientes").appendChild(div);
}

/* ---------------- ELIMINAR ---------------- */
function eliminar(btn){

    let card = btn.parentElement;
    let nombre = card.querySelector("h2").textContent;

    let lista = JSON.parse(localStorage.getItem("pacientes")) || [];

    lista = lista.filter(p => p.nombre !== nombre);

    localStorage.setItem("pacientes", JSON.stringify(lista));

    document.getElementById("listaPacientes").innerHTML = "";
    cargarPacientes();
}

/* ---------------- EDITAR ---------------- */
function editar(btn){

    let card = btn.parentElement;
    let nombre = card.querySelector("h2").textContent;

    let lista = JSON.parse(localStorage.getItem("pacientes")) || [];

    lista = lista.map(p => {

        if(p.nombre === nombre){

            return {
                nombre,
                edad: prompt("Nueva edad:", p.edad),
                sexo: prompt("Nuevo sexo:", p.sexo),
                ocupacion: prompt("Nueva ocupación:", p.ocupacion),
                diagnostico: prompt("Nuevo diagnóstico:", p.diagnostico),
                tratamiento: prompt("Nuevo tratamiento:", p.tratamiento)
            };

        }

        return p;
    });

    localStorage.setItem("pacientes", JSON.stringify(lista));

    document.getElementById("listaPacientes").innerHTML = "";
    cargarPacientes();
}

/* ---------------- CARGAR ---------------- */
function cargarPacientes(){

    let lista = JSON.parse(localStorage.getItem("pacientes")) || [];

    document.getElementById("listaPacientes").innerHTML = "";

    lista.forEach(p => crearCard(p));
}

/* ---------------- LIMPIAR ---------------- */
function limpiar(){

    document.getElementById("nombre").value = "";
    document.getElementById("edad").value = "";
    document.getElementById("sexo").value = "";
    document.getElementById("ocupacion").value = "";
    document.getElementById("diagnostico").value = "";
    document.getElementById("tratamiento").value = "";
}

</script>

</body>
</html>
